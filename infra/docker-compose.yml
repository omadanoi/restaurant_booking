# Full application stack. On machines with Docker:
#   docker compose up --build
# Frontend: http://localhost:5173  ·  API/docs: http://localhost:8000/docs
#
# (Local dev without Docker also works — see README quickstart — using a
# native Postgres/Redis and running each process directly.)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/restaurant_platform
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/restaurant_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: compose-dev-secret-change-me
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ../backend
    command: celery -A app.tasks.celery_app worker -l info
    environment: *backend_env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build: ../backend
    command: celery -A app.tasks.celery_app beat -l info
    environment: *backend_env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
